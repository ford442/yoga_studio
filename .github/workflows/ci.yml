name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and validate content/shaders
        run: npm run check

      - name: Build static export
        run: npm run build

      - name: Static export smoke (files + HTTP 200s)
        run: npm run smoke

      - name: Unit tests with core coverage thresholds
        run: npm run test:coverage

      # The native kernels' fast gate. Host-only: it needs a C++20 compiler and
      # nothing else, so it runs on every push in a couple of seconds. The
      # committed app/lib/gpuChores/wasm/chores.wasm is not rebuilt here — the
      # vitest suite already checks the shipped artifact against the same JS
      # goldens, and `npm run build:chores-wasm` regenerates it when native/
      # changes.
      - name: gpu-chores native kernel tests
        run: npm run test:native

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
