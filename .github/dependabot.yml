version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint (via eslint-config-next) declares `typescript <6.1.0`; with
      # TypeScript 7 `npm run lint` crashes on startup and every CI job goes red.
      # Lift this once typescript-eslint supports TS >= 7.1
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: typescript
        versions: [">=6.1.0"]
