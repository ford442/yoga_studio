<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="altarDark" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#3d2010"/>
      <stop offset="45%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#080406"/>
    </radialGradient>
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="25%" stop-color="#ffb84d"/>
      <stop offset="70%" stop-color="#ff6b1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#altarDark)"/>
  <ellipse cx="960" cy="700" rx="500" ry="80" fill="#0a0604" opacity="0.9"/>
  <rect x="760" y="620" width="400" height="30" rx="4" fill="#2a1810" opacity="0.8"/>
  <circle cx="700" cy="580" r="40" fill="url(#candle)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="960" cy="560" r="55" fill="url(#candle)" filter="url(#glow)" opacity="1"/>
  <circle cx="1220" cy="580" r="40" fill="url(#candle)" filter="url(#glow)" opacity="0.9"/>
  <rect x="695" y="580" width="10" height="50" fill="#f5e6c8" opacity="0.6"/>
  <rect x="955" y="560" width="10" height="70" fill="#f5e6c8" opacity="0.7"/>
  <rect x="1215" y="580" width="10" height="50" fill="#f5e6c8" opacity="0.6"/>
  <ellipse cx="960" cy="400" rx="350" ry="200" fill="#ff9933" opacity="0.08"/>
</svg>
