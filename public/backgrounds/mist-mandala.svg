    <circle cx="960" cy="540" r="280" fill="none" stroke="#e8eef5" stroke-width="1.5" opacity="0.4"/>
    <circle cx="960" cy="540" r="200" fill="none" stroke="#d0dae8" stroke-width="1" opacity="0.35"/>
    <circle cx="960" cy="540" r="120" fill="none" stroke="#b8c8dc" stroke-width="0.8" opacity="0.3"/>
    <circle cx="960" cy="540" r="60" fill="none" stroke="#a0b8d0" stroke-width="0.6" opacity="0.25"/>
  </g>
  <circle cx="300" cy="200" r="80" fill="url(#bokeh)" opacity="0.35"/>
  <circle cx="1600" cy="300" r="100" fill="url(#bokeh)" opacity="0.3"/>
  <circle cx="500" cy="800" r="60" fill="url(#bokeh)" opacity="0.25"/>
  <circle cx="1400" cy="750" r="90" fill="url(#bokeh)" opacity="0.28"/>
  <ellipse cx="960" cy="540" rx="400" ry="400" fill="#e0e8f0" opacity="0.06" filter="url(#fog)"/>
