<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="mistBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#c8d4e8"/>
      <stop offset="40%" stop-color="#8899b0"/>
      <stop offset="75%" stop-color="#3a4558"/>
      <stop offset="100%" stop-color="#121820"/>
    </radialGradient>
    <radialGradient id="bokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog" x="-30%" y="-30%" width="160%" height="160%">
