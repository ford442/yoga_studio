<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="cosmicBase" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="50%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8b0ff"/>
      <stop offset="40%" stop-color="#6b4fd4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3d2a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80e8ff"/>
      <stop offset="50%" stop-color="#22b8d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="bokehBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#cosmicBase)"/>
  <g filter="url(#bokehBlur)">
    <circle cx="400" cy="300" r="120" fill="url(#orb)" opacity="0.7"/>
    <circle cx="1500" cy="250" r="150" fill="url(#orbCyan)" opacity="0.6"/>
    <circle cx="800" cy="700" r="100" fill="url(#orb)" opacity="0.55"/>
    <circle cx="1200" cy="800" r="130" fill="url(#orbCyan)" opacity="0.5"/>
    <circle cx="200" cy="700" r="80" fill="url(#orb)" opacity="0.45"/>
    <circle cx="1700" cy="600" r="90" fill="url(#orbCyan)" opacity="0.4"/>
    <circle cx="960" cy="450" r="200" fill="url(#orb)" opacity="0.35"/>
  </g>
  <circle cx="960" cy="540" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="720" cy="380" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="1100" cy="620" r="2" fill="#ffffff" opacity="0.35"/>
</svg>
